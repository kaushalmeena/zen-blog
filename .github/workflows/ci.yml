name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov=blog --cov-report=term-missing

      - name: Verify migrations match the models
        env:
          APP_CONFIG: development
          FLASK_APP: blog
        run: |
          uv run flask db upgrade
          # 'db check' exits non-zero when the models have drifted from the
          # migration history, which catches a model change with no migration.
          uv run flask db check