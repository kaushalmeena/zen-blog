{% extends "base.html" %}
{% from "partials/macros.html" import icon, field %}

{% block content %}
<div class="page-head">
  <h1 class="page-title">edit comment</h1>
  <p class="page-subtitle">
    on <a href="{{ url_for('posts.view', slug=comment.post.slug) }}">{{ comment.post.title }}</a>
  </p>
</div>

<form method="post">
  {{ form.csrf_token }}
  {{ field(form.body, autofocus=True) }}
  <div class="form-actions">
    <button class="btn btn--solid" type="submit">
      {{ icon('check') }}<span>save</span>
    </button>
    <a class="btn"
       href="{{ url_for('posts.view', slug=comment.post.slug, _anchor='comment-' ~ comment.id) }}">
      <span>cancel</span>
    </a>
  </div>
</form>
{% endblock %}
