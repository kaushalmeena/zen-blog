{% extends "base.html" %}
{% from "partials/macros.html" import icon, field, checkbox %}

{% block content %}
<div class="page-head">
  <h1 class="page-title">login</h1>
</div>

<form method="post">
  {{ form.csrf_token }}
  {{ field(form.username, autofocus=True) }}
  {{ field(form.password) }}
  {{ checkbox(form.remember) }}

  <div class="form-actions">
    <button class="btn btn--solid" type="submit">
      {{ icon('login') }}<span>login</span>
    </button>
    <span class="field__hint">
      No account? <a href="{{ url_for('auth.register') }}">Register</a>.
    </span>
  </div>
</form>
{% endblock %}
