<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="zen-blog">
  <title>zen-blog</title>
  <!--
    An ensō: the zen brush circle, drawn in one stroke and left deliberately
    open.

    The path is a filled outline rather than a stroked arc because a brush swells
    where it presses and thins as it runs dry; a uniform ring would read as a
    plain circle, not as brushwork. The circle is also slightly out of round on
    purpose — a perfect one is not hand-drawn.

    The taper runs 2.8 to 7.4 units wide, which is bolder than a brush would
    really be, because a favicon is rendered at 16px: at that size the whole
    icon is a quarter scale, so a finer dry end would simply disappear.

    Geometry is generated, sampled at 40 segments — coarse enough to keep the
    file small, fine enough that the chord error is about 0.06px.

    The colours are the site's paper and terracotta, hardcoded because a favicon
    renders outside the page and cannot read its custom properties.
  -->
  <rect width="64" height="64" rx="13" fill="#f7f5f0"/>
  <path d="M45.1 12.6L47.9 14.3L50.4 16.6L52.6 19.2L54.3 22.1L55.7 25.2L56.6 28.5L57.0 32.0L57.0 35.5L56.4 39.0L55.3 42.4L53.7 45.6L51.6 48.5L49.2 51.0L46.3 53.2L43.2 54.9L39.8 56.1L36.4 56.8L32.9 56.9L29.4 56.6L26.1 55.8L22.9 54.5L19.9 52.9L17.2 50.9L14.8 48.6L12.7 46.0L10.9 43.2L9.6 40.2L8.6 37.0L8.1 33.7L8.0 30.3L8.5 27.0L9.4 23.8L10.8 20.7L12.7 18.0L15.0 15.5L17.6 13.5L20.4 11.9L23.3 10.4L26.4 9.4L29.6 8.8L29.9 11.6L27.0 12.1L24.3 13.0L21.8 14.3L19.6 16.1L17.7 18.2L16.2 20.5L15.0 23.0L14.2 25.5L13.8 28.1L13.7 30.7L14.1 33.3L14.7 35.7L15.6 38.0L16.8 40.1L18.2 42.0L19.8 43.8L21.6 45.3L23.5 46.6L25.6 47.8L27.9 48.6L30.2 49.2L32.6 49.5L35.1 49.5L37.6 49.1L40.0 48.4L42.3 47.2L44.4 45.8L46.3 44.0L47.9 42.0L49.3 39.7L50.2 37.2L50.9 34.7L51.1 32.0L51.0 29.3L50.6 26.7L49.8 24.1L48.7 21.6L47.2 19.2L45.5 17.0L43.5 15.0Z" fill="#a35c48"/>
