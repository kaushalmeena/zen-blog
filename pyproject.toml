[project]
name = "zen-blog"
version = "2.0.0"
description = "A minimal, JavaScript-free multi-user blogging platform built with Flask and htmx."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kaushal Meena", email = "kaushal.meena1996@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "flask-compress>=1.17",
    "flask-htmx>=0.3.2",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "gunicorn>=23.0.0",
    "markdown>=3.7",
    "nh3>=0.2.20",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.0.1",
    "python-slugify>=8.0.4",
]

[project.urls]
Repository = "https://github.com/kaushalmeena/zen-blog"
Issues = "https://github.com/kaushalmeena/zen-blog/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blog"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic owns the contents of migrations/; its generated files are not ours to style.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
]
ignore = [
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["blog"]
